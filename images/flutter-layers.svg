<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="title desc">
  <title id="title">The tray spike mapped onto Flutter's architecture layers</title>
  <desc id="desc">Three Flutter layers stacked: the framework layer in Dart, with engine A's chat window and engine B's popover; the engine layer, with two engine instances sharing one Dart VM; the embedder layer, with the runner and the plugin's native code; and the operating system below. The Rust library sits beside the framework and engine layers and is reached directly over FFI.</desc>
  <style>
    .layer { fill: #EEEDFE; stroke: #534AB7; }
    .layer-title { fill: #3C3489; }
    .box { fill: #FFFFFF; stroke: #B4B2A9; }
    .title { fill: #2C2C2A; }
    .sub { fill: #5F5E5A; }
    .rust { fill: #FAEEDA; stroke: #854F0B; }
    .rust-title { fill: #633806; }
    .rust-sub { fill: #854F0B; }
    .os { fill: #F1EFE8; stroke: #888780; }
    .os-title { fill: #444441; }
    .arrow { stroke: #5F5E5A; }
    .head { fill: none; stroke: #5F5E5A; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      .layer { fill: #26215C; stroke: #AFA9EC; }
      .layer-title { fill: #CECBF6; }
      .box { fill: #1F1F1E; stroke: #5F5E5A; }
      .title { fill: #F1EFE8; }
      .sub { fill: #B4B2A9; }
      .rust { fill: #412402; stroke: #EF9F27; }
      .rust-title { fill: #FAEEDA; }
      .rust-sub { fill: #FAC775; }
      .os { fill: #2C2C2A; stroke: #888780; }
      .os-title { fill: #D3D1C7; }
      .arrow { stroke: #B4B2A9; }
      .head { stroke: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="layer" x="40" y="30" width="440" height="110" rx="12" stroke-width="0.75"/>
  <text class="t layer-title" x="60" y="52" dominant-baseline="central">Framework layer · Dart</text>
  <rect class="box" x="60" y="68" width="190" height="56" rx="8" stroke-width="0.75"/>
  <text class="t title" x="155" y="88" text-anchor="middle" dominant-baseline="central">Engine A's app</text>
  <text class="s sub" x="155" y="108" text-anchor="middle" dominant-baseline="central">chat window, setUp</text>
  <rect class="box" x="270" y="68" width="190" height="56" rx="8" stroke-width="0.75"/>
  <text class="t title" x="365" y="88" text-anchor="middle" dominant-baseline="central">Engine B's app</text>
  <text class="s sub" x="365" y="108" text-anchor="middle" dominant-baseline="central">popover, trayMain</text>

  <rect class="layer" x="40" y="170" width="440" height="110" rx="12" stroke-width="0.75"/>
  <text class="t layer-title" x="60" y="192" dominant-baseline="central">Engine layer · C++, one Dart VM</text>
  <rect class="box" x="60" y="208" width="190" height="56" rx="8" stroke-width="0.75"/>
  <text class="t title" x="155" y="228" text-anchor="middle" dominant-baseline="central">Engine instance A</text>
  <text class="s sub" x="155" y="248" text-anchor="middle" dominant-baseline="central">isolate 1, own threads</text>
  <rect class="box" x="270" y="208" width="190" height="56" rx="8" stroke-width="0.75"/>
  <text class="t title" x="365" y="228" text-anchor="middle" dominant-baseline="central">Engine instance B</text>
  <text class="s sub" x="365" y="248" text-anchor="middle" dominant-baseline="central">isolate 2, own threads</text>

  <rect class="layer" x="40" y="310" width="440" height="110" rx="12" stroke-width="0.75"/>
  <text class="t layer-title" x="60" y="332" dominant-baseline="central">Embedder layer · native</text>
  <rect class="box" x="60" y="348" width="190" height="56" rx="8" stroke-width="0.75"/>
  <text class="t title" x="155" y="368" text-anchor="middle" dominant-baseline="central">Runner</text>
  <text class="s sub" x="155" y="388" text-anchor="middle" dominant-baseline="central">hosts engine A's window</text>
  <rect class="box" x="270" y="348" width="190" height="56" rx="8" stroke-width="0.75"/>
  <text class="t title" x="365" y="368" text-anchor="middle" dominant-baseline="central">Plugin native code</text>
  <text class="s sub" x="365" y="388" text-anchor="middle" dominant-baseline="central">tray, creates engine B</text>

  <rect class="os" x="40" y="440" width="440" height="40" rx="8" stroke-width="0.75"/>
  <text class="t os-title" x="260" y="460" text-anchor="middle" dominant-baseline="central">OS: X11 · GNOME tray · AppKit</text>

  <rect class="rust" x="510" y="30" width="130" height="250" rx="12" stroke-width="0.75"/>
  <text class="t rust-title" x="575" y="140" text-anchor="middle" dominant-baseline="central">Rust library</text>
  <text class="s rust-sub" x="575" y="162" text-anchor="middle" dominant-baseline="central">shared state</text>
  <text class="s rust-sub" x="575" y="180" text-anchor="middle" dominant-baseline="central">loaded once</text>

  <line class="arrow" x1="482" y1="80" x2="506" y2="80" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="arrow" x1="506" y1="112" x2="484" y2="112" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="arrow" x1="260" y1="143" x2="260" y2="167" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="arrow" x1="260" y1="283" x2="260" y2="307" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="arrow" x1="260" y1="422" x2="260" y2="436" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
