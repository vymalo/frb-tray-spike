name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev xvfb
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: flutter test
      - name: Plugin tests
        run: flutter test
        working-directory: packages/flutter_tray_popover
      - run: xvfb-run -a flutter test integration_test/shared_state_test.dart -d linux
      - name: Two engines end to end
        run: >
          xvfb-run -a flutter drive -d linux
          --driver=test_driver/integration_test.dart
          --target=integration_test/two_engines_drive.dart
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent_tray_demo-linux
          path: build/linux/x64/release/bundle

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: flutter test
      - name: Plugin tests
        run: flutter test
        working-directory: packages/flutter_tray_popover
      - run: flutter build macos --release
      - name: Zip app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/agent_tray_demo.app agent_tray_demo-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent_tray_demo-macos
          path: agent_tray_demo-macos.zip
